<img src="https://raccoonfangz.github.io/images/character.PNG" id="corner-character" alt="Character">

<div id="character-message" style="display: none;">
  <span id="message-text"></span>
</div>

<style>
#theme-toggle {
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

#theme-toggle img {
  vertical-align: middle;
  width: 18px;
  height: 18px;
  position: relative;
  top: -5px;
}

.not-by-ai-badge-container {
  margin: 0;
  padding: 0;
  line-height: 0;
}

.not-by-ai-badge {
  display: block;
}

.not-by-ai-badge img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.collapsible {
  text-align: center;
  cursor: pointer;
  font-weight: bold;
  margin: 0;
  font-size: 0.85em;
}

.arrow {
  display: inline-block;
  transition: transform 0.3s ease;
  margin-right: 4px;
  font-size: 0.85em;
}

.content {
  text-align: center;
  font-size: 0.85em;
}

div p a {
  margin: 0 3px;
  text-decoration: none;
}
</style>

<script>
const savedTheme = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
updateIcon(savedTheme);

document.getElementById('theme-toggle').addEventListener('click', () => {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  updateIcon(newTheme);
});

function updateIcon(theme){
  const icon = document.getElementById('theme-icon');
  if(theme === 'light'){
    icon.src = '/images/moon-symbol.png';
    icon.alt = 'Moon';
  } else {
    icon.src = '/images/sun-symbol.png';
    icon.alt = 'Sun';
  }
}

const collapsible = document.querySelector('.collapsible');
collapsible.addEventListener('click', () => {
  const content = document.getElementById('webrings');
  const arrow = collapsible.querySelector('.arrow');
  if(content.style.maxHeight && content.style.maxHeight !== "0px"){
    content.style.maxHeight = "0px";
    arrow.style.transform = "rotate(0deg)";
  } else {
    content.style.maxHeight = content.scrollHeight + "px";
    arrow.style.transform = "rotate(180deg)";
  }
});

(function(){
  function addTimeToPostDates(){
    if(!document.body.classList.contains('post')) return;
    const timeElements = document.querySelectorAll('main time');
    timeElements.forEach(timeEl => {
      if(!timeEl.dateTime) return;
      const postDate = new Date(timeEl.dateTime);
      const now = new Date();
      const isToday = postDate.getDate() === now.getDate() &&
                      postDate.getMonth() === now.getMonth() &&
                      postDate.getFullYear() === now.getFullYear();

      let hours = postDate.getHours();
      const minutes = postDate.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      const minutesStr = minutes.toString().padStart(2,'0');
      const timeStr = `${hours}:${minutesStr} ${ampm}`;

      const currentDateText = timeEl.innerText.trim();
      if(isToday) timeEl.innerText = `Today • ${timeStr}`;
      else timeEl.innerText = `${currentDateText} • ${timeStr}`;
    });
  }

  if(document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', addTimeToPostDates);
  else
    setTimeout(addTimeToPostDates, 100);
})();

const character = document.getElementById("corner-character");
const messageBox = document.getElementById("character-message");
const messageText = document.getElementById("message-text");

const messages = [
  "Hi.",
  "*pokes you back*",
  "yap yap",
  "What's up",
  "Oh. Again?",
  "Please, stop bothering me",
  "...",
  "...",
  "This is becoming a pattern.",
  "Beware",
  "All this content on my site",
  "and yet,",
  "you choose to poke me",
  "Last warning!!",
  "3",
  "2",
  "1",
  "*BOOM*",
  "...",
  "...",
  "...",
  "Are you proud of yourself?",
  "Must be so fun clicking, no?",
  "There is no secret message",
  "nor a secret game or anything",
  "I SWEAR",
];

let index = 0;
let hideTimeout;
let inactivityTimeout;
let isHolding = false;

function showMessage(msg){
  clearTimeout(hideTimeout);
  messageText.textContent = msg ?? messages[index];
  messageBox.style.display = "block";
  if(!msg) index = (index + 1) % messages.length;

  if(msg !== "*yawn*"){
    character.classList.add("squish");
    setTimeout(() => character.classList.remove("squish"), 150);
  }

  hideTimeout = setTimeout(
    () => messageBox.style.display = "none",
    msg === "*yawn*" ? 1500 : 1200
  );
}

(function(){
  const hour = new Date().getHours();
  const shown = sessionStorage.getItem("nightMessageShown");

  if(hour >= 1 && hour < 4 && !shown){
    sessionStorage.setItem("nightMessageShown","true");
    window.addEventListener("load", () => {
      clearTimeout(hideTimeout);
      messageText.textContent = "Shouldn't you be asleep?";
      messageBox.style.display = "block";
      character.classList.add("squish");
      setTimeout(() => character.classList.remove("squish"), 150);
      hideTimeout = setTimeout(
        () => messageBox.style.display = "none",
        3100
      );
    });
  }
})();

function resetInactivityTimer(){
  clearTimeout(inactivityTimeout);
  inactivityTimeout = setTimeout(() => showMessage("*yawn*"), 35000);
}

["click","scroll","keydown","mousemove"].forEach(evt =>
  document.addEventListener(evt, resetInactivityTimer)
);

resetInactivityTimer();

character.addEventListener("click", () => {
  showMessage();
  resetInactivityTimer();
});

character.addEventListener("mousedown", () => {
  isHolding = true;
  character.classList.add("hold-squish");
});

document.addEventListener("mouseup", () => {
  if(isHolding){
    isHolding = false;
    character.classList.remove("hold-squish");
  }
});
</script>


</body>
</html>
